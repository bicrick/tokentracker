<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tokentracker</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="wrap">
    <nav>
      <a class="brand" href="/">tokentracker</a>
      <div class="links">
        <a href="/">Get your own</a>
        <a href="https://github.com/bicrick/tokentracker">GitHub ↗</a>
      </div>
    </nav>

    <div class="profile" id="profile">
      <div class="profile-head">
        <span class="handle" id="handle">…</span>
        <span class="muted mono" id="devices"></span>
      </div>
      <div class="total">
        <span class="big" id="total">—</span>
        <span class="label">tokens this year</span>
      </div>
      <div id="heatmap"></div>
      <div id="split"></div>
    </div>
    <p class="lede" id="missing" hidden></p>

    <section class="block" aria-labelledby="embed">
      <h2 id="embed">put it on your site</h2>
      <pre id="embed-code"></pre>
    </section>

    <footer>
      <span>tokentracker</span>
      <a href="/">get your own →</a>
    </footer>
  </div>

  <script type="module">
    import { fetchActivity, renderHeatmap, renderSplit, yearTotals, formatCount } from '/app.js';

    const handle = location.pathname.split('/').filter(Boolean)[1] || '';
    document.getElementById('handle').textContent = `@${handle}`;
    document.title = `@${handle} · tokentracker`;
    document.getElementById('embed-code').textContent = `fetch('${location.origin}/api/activity?handle=${handle}')`;

    fetchActivity(handle).then((data) => {
      const { total, sources } = yearTotals(data);
      document.getElementById('total').textContent = formatCount(total).toUpperCase();
      renderHeatmap(document.getElementById('heatmap'), data);
      renderSplit(document.getElementById('split'), sources);
      const machines = new Set((data.devices || []).map((d) => d.device).filter((d) => d !== 'cursor.com'));
      document.getElementById('devices').textContent =
        machines.size ? `${machines.size} machine${machines.size > 1 ? 's' : ''}` : '';
    }).catch((err) => {
      document.getElementById('profile').hidden = true;
      const missing = document.getElementById('missing');
      missing.hidden = false;
      missing.textContent = err.message === 'not found'
        ? `No profile for @${handle} yet.`
        : 'Could not load this profile.';
    });
  </script>
</body>
</html>
