<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tokentracker</title>
  <meta name="description" content="AI token usage across every coding tool and machine, tracked with tokentracker.">
  <link rel="canonical" href="https://tokentracker.patrickbrown.dev/u">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="tokentracker">
  <meta property="og:url" content="https://tokentracker.patrickbrown.dev/u">
  <meta property="og:title" content="tokentracker">
  <meta property="og:description" content="AI token usage across every coding tool and machine, tracked with tokentracker.">
  <meta property="og:image" content="https://tokentracker.patrickbrown.dev/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="tokentracker: your AI token usage, as an API. A pixel-art gold coin over a hoard of coins.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="tokentracker">
  <meta name="twitter:description" content="AI token usage across every coding tool and machine, tracked with tokentracker.">
  <meta name="twitter:image" content="https://tokentracker.patrickbrown.dev/og.png">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="stylesheet" href="/style.css?v=34">
  <link rel="stylesheet" href="/mobile.css?v=34" media="(max-width: 720px)">
  <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <div class="wrap">
    <nav>
      <a class="brand" href="/"><img src="/logo.svg" alt="" width="18" height="18">tokentracker</a>
      <div class="links">
        <a href="/">Get your own</a>
        <a href="/docs">Docs</a>
        <a href="https://github.com/bicrick/tokentracker">GitHub ↗</a>
      </div>
    </nav>

    <div class="profile" id="profile">
      <div class="profile-head">
        <span class="handle" id="handle">…</span>
        <span class="muted mono" id="devices"></span>
      </div>
      <div class="total">
        <span class="big" id="total">—</span>
        <span class="label">tokens this year</span>
      </div>
      <div id="heatmap"></div>
      <div id="split"></div>
    </div>
    <p class="lede" id="missing" hidden></p>

    <section class="block" aria-labelledby="api">
      <h2 id="api">query this profile</h2>
      <pre id="api-links"></pre>
    </section>

    <footer>
      <span>tokentracker · by <a href="https://patrickbrown.dev">bicrick</a></span>
      <a href="/docs">API docs →</a>
    </footer>
  </div>

  <script type="module">
    // Built entirely from the public v1 API
    import { api, formatCount, renderHeatmapGrid, renderSplit } from '/app.js?v=34';

    const handle = (location.pathname.split('/').filter(Boolean)[1] || '').toLowerCase();
    document.getElementById('handle').textContent = `@${handle}`;
    document.title = `@${handle} · tokentracker`;
    const base = `${location.origin}/api/v1/users/${handle}`;
    document.getElementById('api-links').textContent = ['', '/usage?range=30d', '/models', '/tools', '/heatmap', '/stats', '/devices'].map((p) => `GET ${base}${p}`).join('\n');

    Promise.all([
      api(`/users/${handle}/heatmap?range=year`),
      api(`/users/${handle}/tools?range=ytd`),
      api(`/users/${handle}`),
    ]).then(([hm, tools, profile]) => {
      document.getElementById('total').textContent = formatCount(hm.total).toUpperCase();
      renderHeatmapGrid(document.getElementById('heatmap'), hm);
      renderSplit(document.getElementById('split'), Object.fromEntries(tools.rows.map((t) => [t.tool, t.tokens])));
      document.getElementById('devices').textContent = profile.devices ? `${profile.devices} machine${profile.devices > 1 ? 's' : ''}` : '';
    }).catch((err) => {
      document.getElementById('profile').hidden = true;
      const missing = document.getElementById('missing');
      missing.hidden = false;
      missing.textContent = /no tokentracker profile/i.test(err.message) ? `No profile for @${handle} yet.` : 'Could not load this profile.';
    });
  </script>
</body>
</html>
