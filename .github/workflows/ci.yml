name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.13', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Syntax check every module
        shell: bash
        run: |
          git ls-files '*.js' | while read -r f; do node --check "$f" || exit 1; done
      - run: npm test

  package:
    name: npm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Package contains only the CLI, and it runs
        run: |
          npm pack
          files=$(tar -tzf bicrick-tokentracker-*.tgz)
          echo "$files"
          if echo "$files" | grep -vE '^package/(cli/|package\.json$|README\.md$|LICENSE$)'; then
            echo "::error::Unexpected files in the npm package"; exit 1
          fi
          mkdir /tmp/try && tar -xzf bicrick-tokentracker-*.tgz -C /tmp/try
          node /tmp/try/package/cli/tokentrack.js --help | grep -q 'tokentrack init'

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
