name: Release

# Publishing a GitHub release tagged vX.Y.Z (matching package.json) publishes
# that version to npm with provenance. The website deploys separately: Vercel
# builds every push to main.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Tag must match package.json version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match package.json version v${version}"
            exit 1
          fi
      - name: Skip if this version is already on npm
        id: exists
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@bicrick/tokentracker@${version}" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@bicrick/tokentracker@${version} is already published"
          fi
      - run: npm ci
        if: steps.exists.outputs.already != 'true'
      - run: npm test
        if: steps.exists.outputs.already != 'true'
      - name: Publish to npm
        if: steps.exists.outputs.already != 'true'
        run: |
          npm install -g npm@latest
          npm publish --provenance --access public
        env:
          # Empty unless you add an NPM_TOKEN secret; with trusted publishing
          # configured on npmjs.com, npm authenticates via OIDC instead.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
